[project]
name = "latam-miles-mcp"
version = "0.1.0"
description = "MCP server que simula compra de milhas LATAM Pass via navegador headless"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.2",
    "playwright==1.47.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
latam-miles-mcp-http = "latam_miles_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["latam_miles_mcp"]